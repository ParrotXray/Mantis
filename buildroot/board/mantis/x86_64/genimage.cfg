# GPT disk: EFI system partition, two root slots (A/B), data partition.
# The image ships slot A; mantis-upgrade writes the inactive slot.
# S20data grows the data partition to the end of the disk on first boot.

image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 32M
}

image data.ext4 {
	ext4 {
		label = "mantis-data"
		use-mke2fs = true
		features = "^metadata_csum_seed"
	}
	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition efi {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}

	# PARTUUIDs are fixed: grub.cfg passes root=PARTUUID=... per slot
	partition root-a {
		image = "rootfs.ext4"
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = 6d616e74-6973-4000-8000-0000726f6f61
		size = 448M
	}

	partition root-b {
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = 6d616e74-6973-4000-8000-0000726f6f62
		size = 448M
	}

	partition data {
		image = "data.ext4"
		partition-type-uuid = L
	}
}
