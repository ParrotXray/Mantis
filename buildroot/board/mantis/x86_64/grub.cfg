# Mantis A/B boot. State in ${prefix}/grubenv (EFI partition):
#   slot=a|b          the committed, known-good slot
#   try_slot=a|b      a freshly written slot to try once (set by mantis-upgrade)
#   try_count=0|1     0: not tried yet, 1: tried, not confirmed (yet)
#   rollback_from=    set here when a trial did not confirm; read by S99upgrade
# A trial boot passes mantis.trial=1; S99upgrade confirms it once Mantis is
# up (slot=try_slot). If it never confirms (Mantis does not come up, a
# hang, a panic: panic=10 and the software watchdog reboot), the next boot
# finds try_count=1 and goes back to the committed slot. If the trial kernel
# cannot even be loaded, GRUB's fallback entry boots the committed slot.

set default=0
set fallback=1
set timeout=3

if [ -s "${prefix}/grubenv" ]; then
	load_env -f "${prefix}/grubenv"
fi
if [ "${slot}" != "b" ]; then
	set slot=a
fi
# the disk GRUB was started from, e.g. hd0 out of (hd0,gpt1)
regexp --set=1:bootdisk '^([^,]+),' "${root}"

set boot_slot="${slot}"
set trial=0
if [ -n "${try_slot}" ]; then
	if [ "${try_count}" = "0" ]; then
		set try_count=1
		save_env -f "${prefix}/grubenv" try_count
		set boot_slot="${try_slot}"
		set trial=1
	else
		set rollback_from="${try_slot}"
		set try_slot=
		set try_count=0
		save_env -f "${prefix}/grubenv" try_slot try_count rollback_from
	fi
fi

# mantis_boot <slot> <trial 0|1> <quiet|verbose>
function mantis_boot {
	if [ "$1" = "b" ]; then
		set part=gpt3
		set uuid=6d616e74-6973-4000-8000-0000726f6f62
	else
		set part=gpt2
		set uuid=6d616e74-6973-4000-8000-0000726f6f61
	fi
	set verbosity=quiet
	if [ "$3" = "verbose" ]; then
		set verbosity=
	fi
	if [ "$2" = "1" ]; then
		linux (${bootdisk},${part})/boot/bzImage root=PARTUUID=${uuid} rootwait rw mantis.slot=$1 mantis.trial=1 softdog.soft_margin=900 panic=10 console=ttyS0,115200 console=tty1 ${verbosity}
	else
		linux (${bootdisk},${part})/boot/bzImage root=PARTUUID=${uuid} rootwait rw mantis.slot=$1 panic=10 console=ttyS0,115200 console=tty1 ${verbosity}
	fi
}

menuentry "Mantis (slot ${boot_slot})" {
	mantis_boot "${boot_slot}" "${trial}" quiet
}

# fallback: the committed slot, used when the entry above cannot be loaded
menuentry "Mantis (slot ${slot}, last good)" {
	mantis_boot "${slot}" 0 quiet
}

menuentry "Mantis (slot ${slot}, verbose boot)" {
	mantis_boot "${slot}" 0 verbose
}
