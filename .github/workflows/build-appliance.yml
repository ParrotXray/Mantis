name: Build Appliance Image

# Buildroot disk images (buildroot/) for a Mantis release, tested in QEMU and
# attached to that release. Called by build-mantis.yml after each release;
# can also be run by hand for an existing release.

on:
  workflow_call:
    inputs:
      sha:
        description: Release build sha (tag build-<sha>)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sha:
        description: Release build sha (tag build-<sha>); empty = .last-built-version
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: appliance-${{ inputs.sha || github.ref }}
  cancel-in-progress: false

env:
  BR_VERSION: "2026.02.3"

jobs:
  appliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          SHA="${INPUT_SHA:-$(cat .last-built-version)}"
          # mantis-<app version>-linux-amd64-<variant>-<sha>.tar.gz
          APP=$(gh release view "build-$SHA" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | sed -n -E 's/^mantis-(.+)-linux-amd64-.*\.tar\.gz$/\1/p' | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::release build-$SHA has no linux-amd64 assets"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Mantis build-$SHA ($APP)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git rsync cpio bc unzip file wget python3 \
            qemu-system-x86 ovmf python3-pexpect openssh-client
          # let the runner user open /dev/kvm for the QEMU test
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/br-dl
            !~/br-dl/mantis
          key: br-dl-${{ env.BR_VERSION }}-${{ hashFiles('buildroot/configs/**', 'buildroot/package/**') }}
          restore-keys: br-dl-${{ env.BR_VERSION }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/br-ccache
          key: br-ccache-${{ env.BR_VERSION }}-${{ github.run_id }}
          restore-keys: br-ccache-${{ env.BR_VERSION }}-

      - name: Build baseline image
        env:
          MANTIS_SHA: ${{ steps.rel.outputs.sha }}
          MANTIS_APP_VERSION: ${{ steps.rel.outputs.app }}
          MANTIS_VARIANT: baseline
        run: |
          export BR2_DL_DIR="$HOME/br-dl" BR_CCACHE_DIR="$HOME/br-ccache"
          buildroot/build.sh BR2_JLEVEL="$(nproc)" > build.log 2>&1 || { tail -100 build.log; exit 1; }
          grep -E '^check-needed' build.log
          mkdir -p dist
          cp buildroot/output/images/disk.img.gz "dist/mantis-appliance-${MANTIS_APP_VERSION}-linux-amd64-baseline-${MANTIS_SHA}.img.gz"
          cp buildroot/output/images/rootfs.ext4.gz "dist/mantis-rootfs-${MANTIS_APP_VERSION}-linux-amd64-baseline-${MANTIS_SHA}.ext4.gz"

      - name: Test baseline image in QEMU
        run: |
          # works on a copy; needs rootfs.ext4 / data.ext4 next to disk.img for the A/B checks
          python3 -I buildroot/test/qemu-boot-test.py buildroot/output/images/disk.img "$RUNNER_TEMP/qemu" | tee qemu-test.log

      - name: Build avx, avx2, avx512 images
        env:
          MANTIS_SHA: ${{ steps.rel.outputs.sha }}
          MANTIS_APP_VERSION: ${{ steps.rel.outputs.app }}
        run: |
          export BR2_DL_DIR="$HOME/br-dl" BR_CCACHE_DIR="$HOME/br-ccache"
          # same rootfs, only the mantis package and the image are rebuilt
          for v in avx avx2 avx512; do
            MANTIS_VARIANT=$v buildroot/build.sh BR2_JLEVEL="$(nproc)" > "build-$v.log" 2>&1 \
              || { tail -100 "build-$v.log"; exit 1; }
            cp buildroot/output/images/disk.img.gz "dist/mantis-appliance-${MANTIS_APP_VERSION}-linux-amd64-${v}-${MANTIS_SHA}.img.gz"
            cp buildroot/output/images/rootfs.ext4.gz "dist/mantis-rootfs-${MANTIS_APP_VERSION}-linux-amd64-${v}-${MANTIS_SHA}.ext4.gz"
          done
          # disk images for new installs, rootfs images for mantis-upgrade (A/B)
          cd dist && sha256sum *.img.gz *.ext4.gz > "SHA256SUMS-appliance-${MANTIS_SHA}.txt" && ls -lh

      - name: Upload images to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "build-${{ steps.rel.outputs.sha }}" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appliance-logs
          path: |
            build*.log
            qemu-test.log
            ${{ runner.temp }}/qemu/console.log
          retention-days: 7
          if-no-files-found: ignore
