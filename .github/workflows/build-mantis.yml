name: Build Mantis

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  SRC_REPO: ParrotXray/Mantis-Dev

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      full: ${{ steps.upstream.outputs.full }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest Mantis-Dev commit
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.MANTIS_PAT }}
        run: |
          FULL=$(gh api repos/$SRC_REPO/commits/main --jq '.sha')
          echo "full=$FULL" >> $GITHUB_OUTPUT
          echo "sha=${FULL:0:8}" >> $GITHUB_OUTPUT

      - name: Check if already built
        id: check
        run: |
          LAST=$(cat .last-built-version 2>/dev/null || echo none)
          if [ "$LAST" = "${{ steps.upstream.outputs.sha }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.skip == 'false' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-avx512
            runs-on: ubuntu-24.04
            rustflags: "-C target-cpu=x86-64-v4"
            cargo_target: x86_64-unknown-linux-gnu
            avx_level: avx512
          - name: linux-amd64-avx2
            runs-on: ubuntu-24.04
            rustflags: "-C target-cpu=x86-64-v3"
            cargo_target: x86_64-unknown-linux-gnu
            avx_level: avx2
          - name: linux-amd64-avx
            runs-on: ubuntu-24.04
            rustflags: "-C target-cpu=sandybridge"
            cargo_target: x86_64-unknown-linux-gnu
            avx_level: avx
          - name: linux-amd64-baseline
            runs-on: ubuntu-24.04
            rustflags: "-C target-cpu=x86-64"
            cargo_target: x86_64-unknown-linux-gnu
            avx_level: none
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            rustflags: ""
            cargo_target: ""
            avx_level: ""
    runs-on: ${{ matrix.runs-on }}
    name: Build (${{ matrix.name }})
    steps:
      - name: Checkout Mantis-Dev (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ needs.check-version.outputs.full }}
          token: ${{ secrets.MANTIS_PAT }}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang llvm libelf-dev libssl-dev zstd \
            libpcap-dev zlib1g-dev m4
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get install -y gcc-multilib
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install bpf-linker (prebuilt)
        run: |
          BPF_LINKER_VERSION=$(sed -n 's/^BPF_LINKER_VERSION="\(.*\)"/\1/p' tools/xdp-test/run.sh)
          case "$(uname -m)" in
            x86_64)  arch=x86_64 ;;
            aarch64) arch=aarch64 ;;
          esac
          mkdir -p "$HOME/.bpf-linker" /tmp/bl
          curl -fsSL "https://github.com/aya-rs/bpf-linker/releases/download/$BPF_LINKER_VERSION/bpf-linker-$arch-unknown-linux-musl.tar.zst" -o /tmp/bl/bl.tar.zst
          zstd -dq /tmp/bl/bl.tar.zst -o /tmp/bl/bl.tar
          tar -xf /tmp/bl/bl.tar -C /tmp/bl
          install -m 0755 "$(find /tmp/bl -type f -name bpf-linker | head -n 1)" "$HOME/.bpf-linker/bpf-linker.real"
          cat > "$HOME/.bpf-linker/bpf-linker" <<'EOF'
          #!/usr/bin/env bash
          args=(); skip=0
          for a in "$@"; do
            if [ "$skip" = 1 ]; then skip=0; continue; fi
            case "$a" in
              --cpu) skip=1 ;;
              --cpu=*) ;;
              *) args+=("$a") ;;
            esac
          done
          exec "$(dirname "$0")/bpf-linker.real" "${args[@]}"
          EOF
          chmod +x "$HOME/.bpf-linker/bpf-linker"
          echo "$HOME/.bpf-linker" >> "$GITHUB_PATH"
          "$HOME/.bpf-linker/bpf-linker" --version

      - name: make dist
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.rustflags }}
          GH_TOKEN: ${{ secrets.MANTIS_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          AVX_LEVEL: ${{ matrix.avx_level }}
        run: |
          make dist NICE= CARGO_TARGET=${{ matrix.cargo_target }}

      - name: Verify eBPF built and embedded
        run: |
          find target -type f \( -name 'mantis-ingress' -o -name 'mantis-egress' \) -path '*bpfel-unknown-none*' | tee /tmp/ebpf.txt
          [ "$(wc -l < /tmp/ebpf.txt)" -ge 2 ] || { echo "eBPF objects missing"; exit 1; }
          strings build/mantis | grep -q 'access_control' || { echo "eBPF not embedded"; exit 1; }

      - name: Rename artifact
        run: |
          f=$(ls dist/*.tar.gz)
          base=$(basename "$f" .tar.gz | sed -E 's/-(aarch64|x86_64).*//')
          target="dist/${base}-${{ matrix.name }}-${{ needs.check-version.outputs.sha }}.tar.gz"
          [ "$f" != "$target" ] && mv "$f" "$target"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [check-version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: ls -lh artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ needs.check-version.outputs.sha }}
          name: "Mantis ${{ needs.check-version.outputs.sha }}"
          body: |
            Mantis-Dev @ ${{ needs.check-version.outputs.sha }}
            - linux-amd64-avx512: x86-64-v4 (Need AVX-512)
            - linux-amd64-avx2: x86-64-v3 (Need AVX2, most CPUs choose this)
            - linux-amd64-avx: Sandy Bridge and above (No AVX2)
            - linux-amd64-baseline: General x86_64
            - linux-aarch64: ARM64
          files: artifacts/*.tar.gz

      - name: Save built version
        run: |
          echo "${{ needs.check-version.outputs.sha }}" > .last-built-version
          if [ -z "$(git status --porcelain -- .last-built-version)" ]; then
            echo "version already recorded"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-built-version
          git commit -m "chore: built ${{ needs.check-version.outputs.sha }}"
          git pull --rebase origin main
          git push

      - name: Delete build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[].id' | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done